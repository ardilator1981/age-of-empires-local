# Genera un APK de Android con Capacitor y lo adjunta a una Release.
# Se lanza al subir una etiqueta (git tag v1.0.0 && git push origin v1.0.0) o a mano desde la pestaña Actions.
# El APK es de depuración (firmado con una clave de prueba): se instala activando "Instalar apps desconocidas".
name: APK de Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Crear el proyecto Android con Capacitor
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
          # Pantalla horizontal y completa, como la PWA
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape android/app/src/main/AndroidManifest.xml
      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: |
          NAME="age-of-empires-local-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}
      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
