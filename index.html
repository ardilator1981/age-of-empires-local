<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Liada de Imperios</title>
    <meta name="description" content="Estrategia en tiempo real de imperios que cambian con las eras, en el navegador y sin conexión." />
    <meta name="theme-color" content="#2c2621" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Liada de Imperios" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <canvas id="terrain"></canvas>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="topbar">
        <div id="resources"></div>
        <div id="age"></div>
        <div class="spacer"></div>
        <div id="clock">00:00</div>
        <button id="btn-army" data-tip="Seleccionar todo el ejército">⚔️</button>
        <button id="btn-strategy" data-tip="Estrategia: formación, postura y órdenes (Tab)">📜<span class="kb"> Estrategia</span></button>
        <button id="btn-music" data-tip="Sonido (M)"></button>
        <button id="btn-menu">Menú<span class="kb"> (F10)</span></button>
      </div>
      <div id="notices"></div>
      <div id="touchbar">
        <button id="btn-order" class="tbtn off">🎯<span>Ordenar</span></button>
        <button id="btn-idle" class="tbtn">💤<span>Inactivo</span></button>
        <button id="btn-panel" class="tbtn"><i class="fold">▾</i><span>Panel</span></button>
      </div>
      <div id="bottombar">
        <div id="commands"></div>
        <div id="selection"></div>
        <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
      </div>
      <div id="rotate">
        <div class="rot-ic">📱↻</div>
        <p>Gira el móvil para jugar en horizontal</p>
        <button id="btn-rotate-ok">Seguir en vertical</button>
      </div>
    </div>
    <div id="tooltip"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
